name: Auto Push Testfassung

# Baut die Testfassung von CueDesk (Test-DB, Teststreifen) und stellt sie auf
# GitHub Pages unter daucoder2001.github.io/cuedesk/ bereit.
# Laeuft bei jedem Push auf main und auf Knopfdruck. Die Produktion
# (app.cuedesk.de) bringt der Workflow "Produktion" auf den Stand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ganze Historie: die Versionsnummer zaehlt die Commits (src/version.ts)
          fetch-depth: 0

      - name: Version ermitteln
        run: |
          echo "VITE_VERSION_NR=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "VITE_VERSION_DATUM=$(TZ=Europe/Berlin date +%d-%m-%Y)" >> "$GITHUB_ENV"
          echo "VITE_VERSION_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bauen
        env:
          # Adresse und oeffentlicher Schluessel der Datenbank stehen als
          # Repository-Variablen in GitHub (Settings -> Secrets and variables
          # -> Actions -> Variables). Sie sind nicht geheim; geschuetzt wird
          # ueber die Rechte in der Datenbank.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
          # Unterordner auf GitHub Pages. Bei eigener Domain auf "/" aendern.
          VITE_BASIS: /cuedesk/
          # Streifen "Testumgebung" und [TEST] im Tab-Titel (src/testfassung.ts)
          VITE_TESTFASSUNG: '1'
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  bereitstellen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
