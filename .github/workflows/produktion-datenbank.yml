name: Produktion Datenbank

# Spielt neue Migrationen aus supabase/migrations in die Produktion ein
# (supabase db push). Nur auf Knopfdruck und nur von main. Ablauf bei jeder
# Aenderung (docs/Produktion-einrichten.md, "Danach"):
#   1. Migration zuerst in die Test-DB (Probelauf, "einspielen")
#   2. hier mit Modus "probelauf": zeigt, was eingespielt wuerde, schreibt nichts
#   3. hier mit Modus "einspielen"
#   4. danach "Produktion veroeffentlichen"
#
# Nutzt das Secret SUPABASE_DB_URL_PRODUKTION (dasselbe wie die Sicherung).

on:
  workflow_dispatch:
    inputs:
      modus:
        description: 'probelauf zeigt nur an, einspielen schreibt in die Produktion'
        type: choice
        options: [probelauf, einspielen]
        default: probelauf

permissions:
  contents: read

concurrency:
  group: produktion-datenbank
  cancel-in-progress: false

jobs:
  migrationen:
    runs-on: ubuntu-latest
    name: migrationen (${{ inputs.modus }})
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL_PRODUKTION }}
    steps:
      - name: Voraussetzungen pruefen
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then echo "::error::Nur vom Branch main."; exit 1; fi
          if [ -z "$DB_URL" ]; then echo "::error::Secret SUPABASE_DB_URL_PRODUKTION fehlt."; exit 1; fi

      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Ausstehende Migrationen (Probelauf)
        run: |
          set -o pipefail
          supabase db push --db-url "$DB_URL" --dry-run 2>&1 | tee probelauf.txt
          {
            echo "### Probelauf gegen die Produktion"
            echo '```'
            cat probelauf.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Einspielen
        if: inputs.modus == 'einspielen'
        run: |
          set -o pipefail
          supabase db push --db-url "$DB_URL" --yes 2>&1 | tee einspielen.txt
          {
            echo "### Eingespielt"
            echo '```'
            cat einspielen.txt
            echo '```'
            echo "### Stand danach (letzte Migrationen)"
            echo '```'
            supabase migration list --db-url "$DB_URL" 2>&1 | tail -n 6
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
