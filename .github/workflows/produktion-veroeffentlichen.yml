name: Produktion veroeffentlichen

# Baut CueDesk mit der Produktions-Datenbank und legt das Ergebnis in das
# Repository DauCoder2001/cuedesk-app (GitHub Pages unter app.cuedesk.de).
# Laeuft nur auf Knopfdruck (Entscheidung E1 in docs/Produktion-einrichten.md):
# erst in der Testfassung pruefen, Migrationen in die Produktion einspielen,
# dann hier starten.
#
# Einmalig in GitHub (Settings -> Secrets and variables -> Actions):
#   Variable PROD_SUPABASE_URL  Adresse der Produktion (nicht geheim)
#   Variable PROD_SUPABASE_KEY  oeffentlicher Schluessel der Produktion (nicht geheim)
#   Secret   APP_TOKEN          Fine-grained Token, nur Contents: Read and
#                               write auf DauCoder2001/cuedesk-app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: produktion-veroeffentlichen
  cancel-in-progress: false

env:
  ZIEL: DauCoder2001/cuedesk-app
  DOMAIN: app.cuedesk.de

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - name: Voraussetzungen pruefen
        env:
          REF: ${{ github.ref }}
          URL: ${{ vars.PROD_SUPABASE_URL }}
          KEY: ${{ vars.PROD_SUPABASE_KEY }}
          TEST_URL: ${{ vars.VITE_SUPABASE_URL }}
          TOKEN_DA: ${{ secrets.APP_TOKEN != '' }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then echo "::error::Nur vom Branch main veroeffentlichen."; exit 1; fi
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::error::Variable PROD_SUPABASE_URL oder PROD_SUPABASE_KEY fehlt."; exit 1; fi
          if [ "$URL" = "$TEST_URL" ]; then echo "::error::PROD_SUPABASE_URL zeigt auf die Test-Datenbank."; exit 1; fi
          if [ "$TOKEN_DA" != "true" ]; then echo "::error::Secret APP_TOKEN fehlt."; exit 1; fi
          echo "Datenbank: $URL"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bauen
        env:
          VITE_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.PROD_SUPABASE_KEY }}
          # Eigene Domain: die Anwendung liegt im Wurzelordner
          VITE_BASIS: /
        run: npm run build

      - name: Ins Ziel-Repository legen und pushen
        env:
          TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${ZIEL}.git" ziel
          cd ziel
          # Beim ersten Lauf ist das Repository leer und hat noch keinen Branch
          git checkout -B main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../dist/. .
          echo "$DOMAIN" > CNAME
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderung an der Produktion."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "CueDesk ${GITHUB_SHA::7}"
          git push origin main
