name: Sicherung

# Zieht woechentlich einen vollstaendigen Auszug beider Datenbanken und legt
# ihn verschluesselt in je einem privaten Repository ab:
#   test        -> cuedesk-sicherung             (SUPABASE_DB_URL)
#   produktion  -> cuedesk-sicherung-produktion  (SUPABASE_DB_URL_PRODUKTION)
# Zwei getrennte Laeufe; scheitert einer, laeuft der andere trotzdem. Die
# Gratisstufe von Supabase sichert nichts von sich aus.
#
# Noetige Geheimnisse in diesem Repository
# (Settings -> Secrets and variables -> Actions -> Secrets):
#   SUPABASE_DB_URL             Verbindungszeichenfolge der Test-DB
#   SUPABASE_DB_URL_PRODUKTION  Verbindungszeichenfolge der Produktion
#                               (beide: Connect -> Session pooler, mit Passwort)
#   SICHERUNG_TOKEN             Zugriffsschluessel mit Schreibrecht auf beide
#                               Sicherungs-Repositorys
#   SICHERUNG_SCHLUESSEL        langes Kennwort fuer die Verschluesselung (fuer
#                               beide); zusaetzlich ausserhalb von GitHub
#                               aufbewahren, sonst ist keine Sicherung mehr lesbar
#
# Der Auszug enthaelt Mitgliederdaten. GitHub bekommt ihn nur verschluesselt
# (gpg, AES256). Jeder Lauf legt die Historie des Sicherungs-Repositorys neu
# an, damit es wirklich nur die letzten zwoelf Wochen gibt
# (Datenschutzerklaerung). Wiederherstellen:
#   gpg --decrypt sicherung-JJJJ-MM-TT.tar.gz.gpg | tar xz

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

jobs:
  sichern:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - datenbank: test
            ziel: DauCoder2001/cuedesk-sicherung
          - datenbank: produktion
            ziel: DauCoder2001/cuedesk-sicherung-produktion
    name: sichern (${{ matrix.datenbank }})
    env:
      DB_URL: ${{ matrix.datenbank == 'test' && secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_PRODUKTION }}
    steps:
      - name: Sicherungs-Repository holen
        env:
          TOKEN: ${{ secrets.SICHERUNG_TOKEN }}
          ZIEL: ${{ matrix.ziel }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Verbindungszeichenfolge fuer ${{ matrix.datenbank }} fehlt."
            exit 1
          fi
          # git clone statt actions/checkout: das Repository der Produktion ist
          # beim ersten Lauf noch leer
          git clone "https://x-access-token:${TOKEN}@github.com/${ZIEL}.git" sicherung

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Auszug erstellen und verschluesseln
        env:
          SCHLUESSEL: ${{ secrets.SICHERUNG_SCHLUESSEL }}
        run: |
          set -e
          if [ -z "$SCHLUESSEL" ]; then
            echo "SICHERUNG_SCHLUESSEL fehlt - ohne Verschluesselung wird nichts abgelegt."
            exit 1
          fi
          datum=$(date +%Y-%m-%d)
          # Klartext nur im Arbeitsordner des Laufs, nie im Repository
          mkdir -p "auszug/$datum"
          supabase db dump --db-url "$DB_URL" -f "auszug/$datum/schema.sql"
          supabase db dump --db-url "$DB_URL" --data-only -f "auszug/$datum/daten.sql"
          supabase db dump --db-url "$DB_URL" --data-only --schema auth -f "auszug/$datum/konten.sql"
          tar czf - -C auszug "$datum" | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 -o "sicherung/sicherung-$datum.tar.gz.gpg" 3<<<"$SCHLUESSEL"
          rm -rf auszug
          ls -lh "sicherung/sicherung-$datum.tar.gz.gpg"

      - name: Alte Auszuege entfernen
        run: |
          cd sicherung
          # Unverschluesselte Ordner aus der Zeit vor der Verschluesselung
          ls -1d 20*/ 2>/dev/null | xargs -r rm -rf
          # Die letzten zwoelf Wochen bleiben erhalten.
          ls -1 sicherung-*.tar.gz.gpg 2>/dev/null | sort | head -n -12 | xargs -r rm -f
          ls -1 sicherung-*.tar.gz.gpg | tail -n 3

      - name: Ablegen mit neuer Historie
        run: |
          cd sicherung
          git config user.name "CueDesk Sicherung"
          git config user.email "noreply@github.com"
          # Neue Historie aus einem einzigen Stand: geloeschte Auszuege sind
          # danach auch in der Historie nicht mehr vorhanden.
          git checkout --orphan neu
          git add -A
          git commit -m "Sicherung vom $(date +%d.%m.%Y)"
          git push --force origin HEAD:main

      # Rueckmeldung fuer die Konsole in CueDesk - auch wenn ein Schritt davor
      # gescheitert ist. Scheitert die Rueckmeldung selbst, bleibt der Lauf gruen:
      # Die Konsole warnt dann, weil die letzte Meldung zu alt wird.
      - name: Rueckmeldung an CueDesk
        if: always()
        continue-on-error: true
        env:
          ERFOLG: ${{ job.status == 'success' }}
        run: |
          groesse=$(du -sb "sicherung/sicherung-$(date +%Y-%m-%d).tar.gz.gpg" 2>/dev/null | cut -f1)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c \
            "insert into public.system_ereignisse (art, erfolg, groesse_bytes, text)
             values ('sicherung', $ERFOLG, ${groesse:-null}, 'GitHub-Lauf ${{ github.run_id }}')"
