name: Datenbank wachhalten

# Die Gratisstufe von Supabase pausiert ein Projekt nach sieben Tagen ohne
# Zugriff. Dieser Ablauf stellt alle drei Tage eine echte Abfrage und haelt
# das Projekt damit wach, und zwar fuer die Test-Datenbank und die Produktion
# (je ein eigener Lauf, ein Fehler bei der einen bremst die andere nicht).
# Er braucht keine geheimen Daten: die Abfrage laeuft mit dem oeffentlichen
# Schluessel und liest nur die Vereinsliste.

on:
  schedule:
    - cron: '17 4 */3 * *'
  workflow_dispatch:

jobs:
  anklopfen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        datenbank: [test, produktion]
    name: anklopfen (${{ matrix.datenbank }})
    steps:
      - name: Abfrage stellen
        env:
          URL: ${{ matrix.datenbank == 'test' && vars.VITE_SUPABASE_URL || vars.PROD_SUPABASE_URL }}
          KEY: ${{ matrix.datenbank == 'test' && vars.VITE_SUPABASE_KEY || vars.PROD_SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Adresse oder Schluessel fuer ${{ matrix.datenbank }} fehlt (Repository-Variablen)."
            exit 1
          fi
          antwort=$(curl -sS -o /tmp/antwort.json -w '%{http_code}' \
            "$URL/rest/v1/vereine?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Antwort: $antwort"
          head -c 200 /tmp/antwort.json
          test "$antwort" = "200"
