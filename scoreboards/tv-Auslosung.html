<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CueDesk – Auslosung</title>
  <link rel="icon" type="image/svg+xml" href="./img/favicon.svg">
  <style>
    /* ==========================================================================
       EDLES SMART-TV DESIGN (wie die TV-Ansicht in Turnier_Vorbereitung.html)
       ========================================================================== */
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif; background: #111; color: #fff;
      margin: 0; height: 100vh; overflow: hidden;
    }
    /* Auto-Fit: der Inhalt in #tv-stage wird per JS passend auf den Bildschirm skaliert */
    #tv-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #tv-stage { width: 100vw; padding: 3vh 2vw; transform-origin: center center; }
    .tv-title {
      text-align: center; color: #888; font-size: 3.5vh; margin: 0 0 10px;
      font-weight: bold; text-transform: uppercase; letter-spacing: 2px;
    }
    .tv-title .highlight { color: #38bdf8; }
    .tv-subtitle { text-align: center; color: #aaa; font-size: 2.5vh; margin-bottom: 30px; }

    .tv-grid { display: grid; gap: 20px; box-sizing: border-box; }
    .layout-single-group { grid-template-columns: 1fr; max-width: 700px; margin: 0 auto; }
    /* Grosses Spielerfeld (ab 13) und Doppel-KO: ueber die ganze Breite */
    .layout-single-group.breit { max-width: none; }
    .layout-two-groups  { grid-template-columns: 1fr 1fr; }
    .layout-four-groups { grid-template-columns: 1fr 1fr; }

    .table-card {
      background: #222; border-radius: 15px; padding: 25px; display: flex;
      flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 1px solid #333;
    }
    .table-title {
      font-size: 3.5vh; color: #fff; margin-bottom: 15px; font-weight: bold;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #333; padding-bottom: 12px;
    }
    .game-badge { font-size: 2vh; background: #e67e22; padding: 4px 12px; border-radius: 8px; color: #fff; font-weight: bold; }

    .tv-player-list { list-style: none; padding: 0; margin: 0; }
    .tv-player-list li {
      font-size: 3.8vh; font-weight: bold; padding: 10px 18px; margin-bottom: 8px;
      background: #1a1a1a; border-radius: 10px; display: flex; align-items: center;
      border-left: 8px solid #4488ff;
    }
    .tv-player-list li:nth-child(even) { border-left-color: #ff4444; }
    /* Startnummer vor dem Namen; ab 13 Spielern zwei, ab 25 drei Spalten */
    .tv-player-list .nr { color: #777; min-width: 2.2em; font-size: 0.8em; }
    .tv-player-list.spalten-2, .tv-player-list.spalten-3 { display: grid; grid-auto-flow: column; column-gap: 1.5vw; }
    .tv-player-list.spalten-2 li, .tv-player-list.spalten-3 li { border-left-color: #4488ff; }
    /* Doppel-KO: Paarungen der Gewinnerrunde 1 in zwei Spalten */
    .runde-titel { color: #9fb0c0; font-size: 2.4vh; margin: 0 0 1vh; }
    .paarungen { display: grid; grid-auto-flow: column; grid-template-columns: 1fr 1fr; column-gap: 2vw; row-gap: 8px; }
    .paarung { display: flex; align-items: center; gap: 1vw; background: #1a1a1a; border-radius: 10px; padding: 10px 18px; font-size: 3.4vh; font-weight: bold; white-space: nowrap; }
    .paarung .nr { color: #777; min-width: 2em; font-size: 0.8em; }
    .paarung .p1 { color: #ff6b6b; }
    .paarung .p2 { color: #6ba4ff; }
    .paarung .gegen { color: #666; }
    .paarung .frei { color: #777; font-style: italic; font-weight: normal; font-size: 0.8em; }

    .empty { text-align: center; color: #666; font-size: 4vh; margin-top: 18vh; }
    /* Teamvergleich: Teamnamen in Rot und Blau */
    .team-name { padding: 0.3vh 1vw; border-radius: 8px; color: #fff; }
    .team-name.team-1 { background: #c62828; }
    .team-name.team-2 { background: #1f5fae; }
  </style>
</head>
<body>

  <div id="tv-viewport"><div id="tv-stage">
    <div class="tv-title" id="title">📺 Gruppen-Auslosung</div>
    <div class="tv-subtitle" id="subtitle"></div>
    <div class="tv-grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">Warte auf Auslosung…</div>
  </div></div>

  <script type="module">
    // CueDesk: liest das laufende Turnier ueber die Anbindung und zeigt die
    // Teilnehmer in Startnummern-Reihenfolge. Einzelgruppe und Doppel-KO heissen
    // "Spielerfeld"; der Doppel-KO zeigt statt der Liste die Paarungen der
    // Gewinnerrunde 1 (aus tournament/turnierbaum, wie die Seite Turnierbaum).
    import { db, ref, onValue, starten } from "./js/anbindung.ts";
    import { keepScreenAwake } from "./js/wake-lock.js";
    import { startTvAutofit } from "./js/tv-autofit.js";

    await starten();

    // Namen kommen aus CueDesk - nie als HTML einsetzen
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    keepScreenAwake();   // Bildschirm im Kiosk-Betrieb anhalten (Anzeige ohne Interaktion)

    // Auto-Fit + Overscan: Inhalt immer komplett einpassen; Rand kommt aus system/tvSettings.
    let overscanPct = 3;
    const refit = startTvAutofit(document.getElementById('tv-stage'), () => overscanPct);
    onValue(ref(db, 'system/tvSettings'), (snap) => {
      const p = snap.val() && Number(snap.val().overscanPct);
      overscanPct = Number.isFinite(p) ? p : 3;
      refit();
    });

    // CueDesk: Umschaltung am Turnierbildschirm ("TV zeigt"). Die Seiten liegen
    // bei CueDesk alle im Ordner scoreboards.
    const PAGE_FOR = { auslosung: 'tv-Auslosung.html', live: 'tv.html', livenaechste: 'tv.html', naechste: 'tv-Naechste.html', results: 'tv-Turnier-Ergebnis.html', spieltag: 'tv-Spieltag.html', teamstand: 'tv-Teamstand.html', gruppenstand: 'tv-Gruppenstand.html', endplaetze: 'tv-Endplaetze.html', turnierbaum: 'tv-Turnierbaum.html' };
    onValue(ref(db, 'tournament/tvView'), (snap) => {
      const target = PAGE_FOR[snap.val()] || 'tv.html';
      if (target !== 'tv-Auslosung.html') window.location.href = target;
    });

    const titleEl = document.getElementById('title');
    const subEl   = document.getElementById('subtitle');
    const gridEl  = document.getElementById('grid');
    const emptyEl = document.getElementById('empty');

    // CueDesk: Die Tische waehlen die Spieler am Tablet selbst, Gruppen heissen A bis D
    // Teamvergleich: Teamname statt Gruppe, Kapitaen statt Tisch-Hinweis
    function tableBadge(mode, g, t) { return t && t.groupNames ? (t.captains && t.captains[g] ? 'Kapitän: ' + t.captains[g] : 'Team') : 'alle Tische'; }
    function groupLabel(mode, g, t) { return t && t.groupNames && t.groupNames[g] ? t.groupNames[g] : (mode === 'single' ? 'Spielerfeld · ' + Object.keys(t.players).length + ' Spieler' : ('Gruppe ' + 'ABCD'.charAt(g - 1))); }
    function layoutClass(n) { return n === 4 ? 'layout-four-groups' : (n === 2 ? 'layout-two-groups' : 'layout-single-group'); }

    let aktiv = null;
    let baum = null;
    onValue(ref(db, 'tournament/active'), (snap) => { aktiv = snap.val(); zeichnen(); });
    onValue(ref(db, 'tournament/turnierbaum'), (snap) => { baum = snap.val(); zeichnen(); });

    // Doppel-KO: Paarungen der Gewinnerrunde 1, Freilos allein
    function paarungenHtml(spiele) {
      const name = (s) => s && s.name ? esc(s.name) : '';
      return '<div class="runde-titel">Gewinnerrunde 1</div><div class="paarungen" style="grid-template-rows: repeat(' + Math.ceil(spiele.length / 2) + ', auto)">'
        + spiele.map((s, i) => {
          const nr = '<span class="nr">' + (i + 1) + '</span>';
          if (s.a.frei || s.b.frei) {
            const wer = s.a.frei ? s.b : s.a;
            return '<div class="paarung">' + nr + '<span>' + name(wer) + '</span><span class="frei">Freilos</span></div>';
          }
          return '<div class="paarung">' + nr + '<span class="p1">' + name(s.a) + '</span><span class="gegen">–</span><span class="p2">' + name(s.b) + '</span></div>';
        }).join('') + '</div>';
    }

    function zeichnen() {
      const t = aktiv;
      if (!t || !t.players) {
        titleEl.innerHTML = '📺 Gruppen-Auslosung';
        subEl.textContent = '';
        gridEl.innerHTML = '';
        emptyEl.style.display = 'block';
        refit();
        return;
      }
      emptyEl.style.display = 'none';

      const numGroups = t.mode === 'four' ? 4 : (t.mode === 'two' ? 2 : 1);
      const g1 = baum && baum.art === 'dko' && Array.isArray(baum.spiele)
        ? baum.spiele.filter((s) => s.spalte === 'Gewinnerrunde 1' && !s.entfaellt)
        : [];
      const dko = g1.length > 0;
      const anzahl = Object.keys(t.players).length;
      const spalten = numGroups === 1 && !t.groupNames ? (anzahl >= 25 ? 3 : anzahl >= 13 ? 2 : 1) : 1;

      // Spieler nach Gruppe sammeln (Reihenfolge der Auslosung bleibt erhalten)
      const groups = {};
      for (let g = 1; g <= numGroups; g++) groups[g] = [];
      Object.values(t.players).forEach(p => { if (groups[p.group]) groups[p.group].push(p.name); });

      // Kopfzeile
      titleEl.innerHTML = t.groupNames
        ? `📺 Teams — <span class="highlight">${esc(t.discipline || '')}</span>`
        : `📺 Auslosung — <span class="highlight">${esc(t.discipline || '')}</span> (Race to ${t.raceTo || ''})${dko ? ' · Doppel-KO' : ''}`;
      // Symbol aus dem am Turnier eingefrorenen Schalter, nicht aus dem Namen -
      // sonst bekaeme eine selbst angelegte Art immer die Medaille.
      let sub = `🏆 ${esc(t.type || '')}`;
      if (t.eventDate) sub += ` &nbsp;&nbsp;📅 ${t.eventDate}`;
      if (t.startTime) sub += ` &nbsp;&nbsp;⏰ Start: ${t.startTime} Uhr`;
      subEl.innerHTML = sub;

      // Gruppen-Raster
      gridEl.className = 'tv-grid ' + layoutClass(numGroups) + (dko || spalten > 1 ? ' breit' : '');
      let html = '';
      for (let g = 1; g <= numGroups; g++) {
        // Einzelgruppe: Startnummer davor, lange Listen in Spalten
        const mitNr = numGroups === 1 && !t.groupNames;
        const lis = groups[g].map((n, i) => `<li>${mitNr ? `<span class="nr">${i + 1}</span>` : ''}${esc(n)}</li>`).join('');
        const zeilen = Math.ceil(groups[g].length / spalten);
        const liste = dko
          ? paarungenHtml(g1)
          : `<ul class="tv-player-list${spalten > 1 ? ' spalten-' + spalten : ''}"${spalten > 1 ? ` style="grid-template-rows: repeat(${zeilen}, auto)"` : ''}>${lis}</ul>`;
        html += `<div class="table-card">
            <div class="table-title">
              <span class="${t.groupNames ? 'team-name team-' + g : ''}">👥 ${esc(groupLabel(t.mode, g, t))}</span>
              <span class="game-badge">${esc(tableBadge(t.mode, g, t))}</span>
            </div>
            ${liste}
          </div>`;
      }
      gridEl.innerHTML = html;
      refit();
    }
  </script>

</body>
</html>
