<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>CueDesk – TV-Ansicht</title>
  <style>
    /* Dunkles Theme für den Fernseher blendet weniger und wirkt modern */
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }
    /* Auto-Fit-Rahmen: das 2x2-Raster (#tv-stage) wird per JS auf den sichtbaren
       Bereich skaliert – vor allem fuer den Overscan-Sicherheitsrand. */
    #tv-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #tv-stage {
      width: 100vw; height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 15px;
      padding: 15px;
      box-sizing: border-box;
      transform-origin: center center;
    }
    .table-card { 
      background: #222; 
      border-radius: 15px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      text-align: center; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .table-title { 
      font-size: 3.5vh; 
      color: #888; 
      margin-bottom: auto; 
      font-weight: bold;
    }
    .game-badge {
      font-size: 2vh;
      background: #333;
      padding: 3px 10px;
      border-radius: 5px;
      vertical-align: middle;
      margin-left: 10px;
      color: #ccc;
    }
    .matchup { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 5vh; 
      font-weight: bold; 
      margin: 20px 0;
    }
    .p1, .p2 {
      flex: 1;
      /* Lange Namen sauber umbrechen statt das Layout zu sprengen */
      font-size: clamp(2.2vh, 4vh, 4.5vh);
      line-height: 1.1;
      overflow-wrap: break-word;
      word-break: break-word;
      hyphens: auto;
      /* Maximal 3 Zeilen, danach "..." */
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .p1 { color: #ff4444; text-align: right; }
    .p2 { color: #4488ff; text-align: left; }
    .score { 
      font-size: 10vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      flex: 0 0 auto;
      margin: 0 20px; 
      background: #000;
      padding: 10px 20px;
      border-radius: 10px;
    }
    .score span { padding: 0 15px; }
    .colon { color: #555; }
    .stats { 
      font-size: 2.5vh; 
      color: #aaa; 
      margin-top: auto; 
    }
    .inactive { color: #555; font-size: 4vh; margin: auto; }
    /* "TV zeigt: Live + Nächste" bei 3 oder 5 Tischen: die freie Kachel zeigt die
       naechsten offenen Paarungen (wie tv-Naechste.html, aber kompakt) */
    .naechste-karte { justify-content: flex-start; text-align: left; padding: 1.6vh 1.4vw; overflow: hidden; }
    .naechste-karte .kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 1vw; margin-bottom: 1.4vh; }
    .naechste-karte .titel { color: #ddd; font-size: 3.2vh; font-weight: bold; white-space: nowrap; }
    .naechste-karte .sub { color: #888; font-size: 1.7vh; text-align: right; }
    .naechste-karte .liste { display: grid; gap: 1vh; }
    .naechste-karte .spiel { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 1vw;
                             background: #2c2c2c; border-radius: 8px; padding: 0.9vh 0.9vw; }
    .naechste-karte .marke { display: inline-block; color: #fff; border-radius: 5px; padding: 0.3vh 0.6vw; font-size: 1.5vh; font-weight: bold; white-space: nowrap; }
    .naechste-karte .gruppe-A { background: #2f9a76; }
    .naechste-karte .gruppe-B { background: #3a7fbf; }
    .naechste-karte .gruppe-C { background: #c95300; }
    .naechste-karte .gruppe-D { background: #8a44ad; }
    .naechste-karte .gruppe-neutral { background: #555; }
    .naechste-karte .paar { font-size: 2.8vh; font-weight: bold; overflow-wrap: anywhere; }
    /* .p1/.p2 der Tischkacheln (Zeilenbegrenzung, Ausrichtung) hier aufheben */
    .naechste-karte .p1, .naechste-karte .p2 { display: inline; flex: none; font-size: inherit; text-align: left; overflow: visible; -webkit-line-clamp: unset; line-clamp: none; }
    .naechste-karte .p1 { color: #ff4444; }
    .naechste-karte .p2 { color: #4488ff; }
    .naechste-karte .gegen { color: #666; margin: 0 0.5vw; }
    .naechste-karte .zustand { font-size: 1.6vh; text-align: right; }
    .naechste-karte .bereit { color: #22c55e; }
    .naechste-karte .wartet { color: #e0b050; }
    .naechste-karte .leer { color: #666; font-size: 3vh; margin: auto; text-align: center; }
    /* 5 Tische (3x2): kleinere Kachel, kleinere Schrift */
    .naechste-karte.klein .paar { font-size: 2.2vh; }
    .naechste-karte.klein .titel { font-size: 2.6vh; }
  </style>
  <link rel="icon" type="image/svg+xml" href="./img/favicon.svg">
</head>
<body>

  <!-- CueDesk: Die Kacheln entstehen aus der Tischliste des Vereins (siehe Skript). -->
  <div id="tv-viewport"><div id="tv-stage"></div></div>

  <script type="module">
    // CueDesk: Anbindung mit denselben Funktionen wie frueher Firebase. Das
    // Fernsehgeraet ist wie ein Tablet gekoppelt, nur ohne Tisch.
    import { db, ref, onValue, starten, tischNummern } from "./js/anbindung.ts";
    import { tischEnde } from "./js/board-regeln.ts";
    import { naechsteSpiele } from "./js/turnier-plan.ts";
    import { keepScreenAwake } from "./js/wake-lock.js";
    import { startTvAutofit } from "./js/tv-autofit.js";

    await starten();

    // Raster nach Zahl der aktiven Tische: 1-2 nebeneinander, 3-4 als 2x2, 5-6 als 3x2 usw.
    const nummern = await tischNummern();
    const stage = document.getElementById('tv-stage');
    const spalten = nummern.length <= 2 ? Math.max(1, nummern.length) : nummern.length <= 4 ? 2 : 3;
    const zeilen = Math.max(1, Math.ceil(nummern.length / spalten));
    stage.style.gridTemplateColumns = 'repeat(' + spalten + ', 1fr)';
    stage.style.gridTemplateRows = 'repeat(' + zeilen + ', 1fr)';
    stage.innerHTML = nummern.map((n) =>
      '<div id="table-' + n + '" class="table-card"><div class="inactive">Warte auf Tisch ' + n + '...</div></div>'
    ).join('');

    // Namen kommen aus CueDesk (auch am Tablet angelegte Gaeste) - nie als HTML einsetzen
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    keepScreenAwake();   // Bildschirm im Kiosk-Betrieb anhalten (Anzeige ohne Interaktion)

    // Overscan-Sicherheitsrand aus system/tvSettings (Raster ist konstant gross,
    // daher genuegen Start + Resize + Overscan-Aenderung – kein Refit je Render).
    let overscanPct = 3;
    const refit = startTvAutofit(document.getElementById('tv-stage'), () => overscanPct);
    onValue(ref(db, 'system/tvSettings'), (snap) => {
      const p = snap.val() && Number(snap.val().overscanPct);
      overscanPct = Number.isFinite(p) ? p : 3;
      refit();
    });

    // CueDesk: Umschaltung am Turnierbildschirm ("TV zeigt"). Die Seiten liegen
    // bei CueDesk alle im Ordner scoreboards.
    const PAGE_FOR = { auslosung: 'tv-Auslosung.html', live: 'tv.html', livenaechste: 'tv.html', naechste: 'tv-Naechste.html', results: 'tv-Turnier-Ergebnis.html', spieltag: 'tv-Spieltag.html', teamstand: 'tv-Teamstand.html', gruppenstand: 'tv-Gruppenstand.html', endplaetze: 'tv-Endplaetze.html' };
    // "Live + Nächste": nur bei 3 oder 5 Tischen (dort bleibt im Raster eine
    // Kachel frei) und nur, solange ein Turnier laeuft. Sonst wie "Live-Tische".
    const freieKachel = nummern.length === 3 || nummern.length === 5;
    let aktivesTurnier = null;
    let tvView = null;
    onValue(ref(db, 'tournament/tvView'), (snap) => {
      tvView = snap.val();
      const target = PAGE_FOR[tvView] || 'tv.html';
      if (target !== 'tv.html') window.location.href = target;
      renderNaechste();
    });

    onValue(ref(db, 'tournament/active'), (snap) => {
      aktivesTurnier = snap.val();
      renderNaechste();
    });

    function renderNaechste() {
      let feld = document.getElementById('naechste-feld');
      if (!(freieKachel && tvView === 'livenaechste' && aktivesTurnier)) {
        if (feld) feld.remove();
        return;
      }
      if (!feld) {
        feld = document.createElement('div');
        feld.id = 'naechste-feld';
        feld.className = 'table-card naechste-karte' + (nummern.length === 5 ? ' klein' : '');
        stage.append(feld);
      }
      const t = aktivesTurnier;
      const plan = t.schedule || null;
      const alle = plan ? Object.values(plan) : [];
      const fertig = alle.filter((e) => e.status === 'completed').length;
      const sub = [t.name, alle.length ? fertig + ' von ' + alle.length + ' beendet' : ''].filter(Boolean).join(' · ');
      const spiele = naechsteSpiele(plan, nummern.length === 5 ? 4 : 6);
      const farbe = (group) => {
        const g = /^Gruppe ([A-D])\b/.exec(group || '');
        return g ? 'gruppe-' + g[1] : 'gruppe-neutral';
      };
      const tischText = (n) => (n ? 'an Tisch ' + esc(n) : 'an einem anderen Tisch');
      const liste = spiele.length === 0
        ? '<div class="leer">' + (alle.some((e) => e.status === 'running') ? 'Alle Spiele zugeteilt' : 'Keine offenen Spiele') + '</div>'
        : '<div class="liste">' + spiele.map(({ eintrag: e, belegt }) => {
            const marke = [e.begegnung, e.group].filter(Boolean).join(' · ');
            const zustand = belegt.length === 0
              ? '<span class="bereit">bereit</span>'
              : '<span class="wartet">' + belegt.map((b) => esc(b.name) + ' spielt ' + tischText(b.tisch)).join('<br>') + '</span>';
            return '<div class="spiel">'
              + '<span>' + (marke ? '<span class="marke ' + farbe(e.group) + '">' + esc(marke) + '</span>' : '') + '</span>'
              + '<span class="paar"><span class="p1">' + esc(e.player1) + '</span><span class="gegen">–</span><span class="p2">' + esc(e.player2) + '</span></span>'
              + '<span class="zustand">' + zustand + '</span>'
              + '</div>';
          }).join('') + '</div>';
      feld.innerHTML = '<div class="kopf"><span class="titel">Nächste Spiele</span><span class="sub">' + esc(sub) + '</span></div>' + liste;
    }

    // Turnierstatus mitlesen -> "Freies Spiel"-Badge waehrend eines Turniers
    let tournamentRunning = false;
    let lastTablesData = null;

    onValue(ref(db, 'tournament/active/status'), (snap) => {
      tournamentRunning = snap.val() === 'running';
      renderTables();
    });

    const tablesRef = ref(db, 'tables');

    onValue(tablesRef, (snapshot) => {
      lastTablesData = snapshot.val();
      renderTables();
    });

    function renderTables() {
      const data = lastTablesData;

      for (const i of nummern) {
        const container = document.getElementById(`table-${i}`);
        const tableData = data ? data[i] : null;
        
        if (tableData) {
          const isPool = tableData.gameType === "pool";
          // CueDesk: nach dem Ende statt Anstoss bzw. "Am Tisch" der Sieger
          const ende = tischEnde(tableData);
          const endeText = ende === null ? '' : ende === 0 ? 'Spiel beendet'
            : `Spiel beendet · Sieg <strong style="color:${ende === 1 ? '#ff4444' : '#4488ff'}">${esc(ende === 1 ? tableData.player1 : tableData.player2)}</strong>`;

          if (isPool) {
            // ==========================================
            // DARSTELLUNG FÜR 8-/9-/10-BALL (POOL)
            // ==========================================
            const nextBreakName = tableData.nextBreak === 1 ? tableData.player1 : tableData.player2;
            const breakColor = tableData.nextBreak === 1 ? "#ff4444" : "#4488ff";
            let extraBadge = '';
            if (tableData.raceTo) extraBadge = ` <span class="game-badge">Race to ${tableData.raceTo}</span>`;
            // CueDesk: auch mit Ausspielziel; dieselbe Regel wie bei 14.1 und auf Live/Zuschauen
            if (tournamentRunning && !tableData.tournamentMatchId) extraBadge += ` <span class="game-badge" style="background:#6c757d;">Freies Spiel</span>`;

            // CueDesk: Disziplin der Partie (vom Tablet beim Start mitgeschrieben);
            // beim freien Spiel steht sie erst beim Speichern fest
            const disziplin = tableData.discipline || '8/9/10-Ball';

            container.innerHTML = `
              <div class="table-title">Tisch ${i} <span class="game-badge">${esc(disziplin)}</span>${extraBadge}</div>
              <div class="matchup">
                <div class="p1">${esc(tableData.player1 || "Spieler 1")}</div>
                <div class="score">
                  <span style="color:#ff4444">${tableData.score1 || 0}</span> 
                  <span class="colon">:</span> 
                  <span style="color:#4488ff">${tableData.score2 || 0}</span>
                </div>
                <div class="p2">${esc(tableData.player2 || "Spieler 2")}</div>
              </div>
              <div class="stats">
                ${endeText || `Nächster Anstoß: <strong style="color:${breakColor}">${esc(nextBreakName)}</strong>`}
              </div>
            `;
          } else {
            // ==========================================
            // DARSTELLUNG FÜR 14.1 ENDLOS
            // ==========================================
            const activePlayer = tableData.turn === 1 ? tableData.player1 : tableData.player2;
            const activeColor = tableData.turn === 1 ? "#ff4444" : "#4488ff";
            // Höchste Aufnahmen-Zahl ermitteln
            const maxInn = Math.max(tableData.inn1 || 0, tableData.inn2 || 0);
            // CueDesk: die 14.1-Partie eines Spieltags ist kein freies Spiel
            const freeBadge141 = tournamentRunning && !tableData.tournamentMatchId ?` <span class="game-badge" style="background:#6c757d;">Freies Spiel</span>` : '';

            container.innerHTML = `
              <div class="table-title">Tisch ${i} <span class="game-badge">14.1</span>${freeBadge141}</div>
              <div class="matchup">
                <div class="p1">${esc(tableData.player1 || "Spieler 1")}</div>
                <div class="score">
                  <span style="color:#ff4444">${tableData.s1 || 0}</span> 
                  <span class="colon">:</span> 
                  <span style="color:#4488ff">${tableData.s2 || 0}</span>
                </div>
                <div class="p2">${esc(tableData.player2 || "Spieler 2")}</div>
              </div>
              <div class="stats">
                ${endeText || `Am Tisch: <strong style="color:${activeColor}">${esc(activePlayer)}</strong>`} &nbsp;|&nbsp;
                Ziel: ${tableData.target || 40} Pkt. / ${tableData.targetInn || 20} Aufn. &nbsp;|&nbsp;
                Aufnahme: ${maxInn}
              </div>
            `;
          }
        } else {
          // Falls noch keine Daten für diesen Tisch existieren
          container.innerHTML = `
            <div class="table-title">Tisch ${i}</div>
            <div class="inactive">Tisch nicht besetzt</div>
          `;
        }
      }
    }
  </script>
</body>
</html>
